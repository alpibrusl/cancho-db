name: pages

# The landing page: site/index.html, served by GitHub Pages. The repository's Settings > Pages > Source must be "GitHub Actions" for this workflow to be what serves it. With the source set to "Deploy from a branch",
# branch main, folder /docs, GitHub serves docs/ instead and needs docs/index.html: that file is a copy of site/index.html, and scripts/check.sh fails if they differ.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
