name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The gate in seven parts, run at once (scripts/check.sh says what each is and checks that this list is its own): the checks, and six shards of the mutants.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - checks
          - mutants-a
          - mutants-b
          - mutants-c
          - mutants-d
          - mutants-e
          - mutants-f
    steps:
      - uses: actions/checkout@v4
        with:
          path: db

      # The compiler these sources are built with: the release pinned in cancho.toml (`[package] cancho`), read from there so there is one place to change it, and installed prebuilt.
      - name: Install the pinned compiler
        working-directory: db
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          test -n "$pin" || { echo "cancho.toml has no compiler pin" >&2; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The second verifier's one dependency (Ed25519)
        run: pip install cryptography

      - name: strace (the log directory's tests read the order of fsyncs from the kernel's side)
        run: command -v strace || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)

      # Formatting, reproducible vectors, build, authority, both verifiers on every vector, the command lines,
      # differential fuzzing, and the mutants of both verifiers (each must make a vector fail).
      - name: Check
        working-directory: db
        run: sh scripts/check.sh ${{ matrix.part }}
